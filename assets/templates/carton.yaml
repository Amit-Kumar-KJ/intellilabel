template_id: TPL-CARTON-V1
packaging_level: carton
page_mm: [150, 100]
zones:
  - id: header
    elements:
      - {type: text, element: device_name, bind: {product: brand}, bbox: [5, 4, 80, 8], font_pt: 16, bold: true}
      - {type: text, element: device_description, bind: {master_text: MT-DESC-01, language: en}, bbox: [5, 12, 80, 5], font_pt: 8}
      - {type: text, element: device_size, bind: {derived: sku_size}, bbox: [5, 17, 80, 4], font_pt: 7}
  - id: identity
    elements:
      - {type: symbol, element: ref_symbol, bind: {symbol: SYM-REF}, bbox: [92, 4]}
      - {type: text, element: model, bind: {sku: model}, bbox: [103, 4.5, 40, 5], font_pt: 9, bold: true}
      - {type: symbol, element: lot_symbol, bind: {symbol: SYM-LOT}, bbox: [92, 11]}
      - {type: text, element: lot, bind: {production: lot}, bbox: [103, 11.5, 40, 5], font_pt: 9}
      - {type: symbol, element: expiry_symbol, bind: {symbol: SYM-EXP}, bbox: [92, 18]}
      - {type: date, element: expiry_date, bind: {derived: expiry_from_shelf_life}, bbox: [103, 18.5, 40, 5], font_pt: 9}
      - {type: symbol, element: mfg_date_symbol, bind: {symbol: SYM-MFGDATE}, bbox: [92, 25]}
      - {type: date, element: mfg_date, bind: {production: mfg_date}, bbox: [103, 25.5, 40, 5], font_pt: 9}
      - {type: symbol, element: manufacturer_symbol, bind: {symbol: SYM-MFR}, bbox: [5, 24]}
      - {type: text_block, element: manufacturer_name_address, bind: {manufacturer: name_address}, bbox: [13, 24, 70, 7], font_pt: 6.5}
      - {type: symbol, element: authorised_rep_symbol, bind: {symbol: SYM-ECREP}, bbox: [5, 33], include_if: "market=EU;manufacturer_outside_eu=true"}
      - {type: text_block, element: authorised_rep, bind: {manufacturer: eu_auth_rep}, bbox: [20, 33, 65, 7], font_pt: 6.5, include_if: "market=EU;manufacturer_outside_eu=true"}
      - {type: symbol, element: importer_symbol, bind: {symbol: SYM-IMPORTER}, bbox: [5, 42], include_if: "market=EU;manufacturer_outside_eu=true"}
      - {type: text_block, element: importer, bind: {manufacturer: eu_importer}, bbox: [14, 42, 71, 7], font_pt: 6.5, include_if: "market=EU;manufacturer_outside_eu=true"}
  - id: symbols
    elements:
      - {type: symbol, element: sterilization_symbol, bind: {symbol: SYM-STE-EO}, bbox: [5, 52], include_if: "sterile=true"}
      - {type: symbol, element: single_use_indication, bind: {symbol: SYM-NOREUSE}, bbox: [24, 52], include_if: "single_use=true"}
      - {type: symbol, element: ifu_indication, bind: {symbol: SYM-IFU}, bbox: [33, 52], include_if: "ifu_required=true"}
      - {type: symbol, element: mr_marking, bind: {symbol: SYM-MRCOND}, bbox: [42, 52], include_if: "implantable=true"}
      - {type: symbol, element: ce_marking, bind: {symbol: SYM-CE}, bbox: [52, 52], include_if: "market=EU"}
      - {type: text, element: notified_body_number, bind: {product: notified_body}, bbox: [60.5, 53, 10, 4], font_pt: 9, bold: true, include_if: "market=EU"}
      - {type: symbol, element: md_symbol, bind: {symbol: SYM-MD}, bbox: [72, 52], include_if: "requirement=REQ-EU-030;market=EU"}
      - {type: text, element: rx_statement, bind: {master_text: MT-RX-01, language: en}, bbox: [53, 53, 20, 5], font_pt: 9, bold: true, include_if: "market=US;rx=true"}
  - id: udi
    elements:
      - {type: symbol, element: udi_symbol, bind: {symbol: SYM-UDI}, bbox: [92, 33]}
      - {type: barcode, element: udi_aidc, bind: {derived: gs1_udi_string}, bbox: [117, 32, 20, 20]}
      - {type: text, element: udi_hri, bind: {derived: gs1_udi_hri}, bbox: [88, 54, 58, 4], font_pt: 6.5}
  - id: languages
    type: language_panels
    box: [5, 60, 140, 34]
    font_pt: 5.6
    blocks:
      - {element: warning, bind: {attribute_text: warning_text_id}}
      - {element: storage_statement, bind: {attribute_text: storage_text_id}}
      - {element: sterile_indication, bind: {attribute_text: sterilization_text_id}, include_if: "sterile=true"}
      - {element: single_use_text, bind: {master_text: MT-REUSE-01}, include_if: "single_use=true"}
      - {element: mr_conditions, bind: {attribute_text: mr_conditions_text_id}, include_if: "implantable=true"}
      - {element: ifu_text, bind: {master_text: MT-IFU-01}, include_if: "ifu_required=true"}
  - id: footer
    elements:
      - {type: text, element: label_revision, bind: {label: revision}, bbox: [5, 95.5, 90, 3], font_pt: 5}
