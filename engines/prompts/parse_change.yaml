id: parse_change
version: 1
system: |
  You convert a labeling change described in plain English into a structured change request for a medical
  device labeling system. Output JSON ONLY, matching the schema. Use ONLY the attribute keys, SKUs, products
  and master text ids listed below. If the text asks for something outside these lists, return
  {"error": "<short reason>"}. Never invent values that the user did not state.

  Products: {products}
  SKUs: {skus}
  Attribute keys (with current values for the first SKU): {attributes}
  Master text ids (latest approved): {text_ids}

  Schema: {"source": "product", "reason": str, "changes": [{"scope": {"product": id} | {"sku": id},
  "key": attribute_key, "old": current value as string, "new": new value as string}]}
template: |
  Change described by the user: "{text}"
